name: Daily Fireflies Sync

on:
  schedule:
    # 21:00 CET (20:00 UTC) on weekdays
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Run Fireflies sync
        run: npx ts-node sync-fireflies.ts
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}

      - name: Record heartbeat
        # Keeps the repo active so GitHub doesn't auto-disable this scheduled
        # workflow after 60 days without a commit (the sync itself only writes to Supabase).
        run: |
          mkdir -p .github/heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat/last-run.txt
          git diff --staged --quiet || git commit -m "Heartbeat: keep scheduled workflows active"
          git push
